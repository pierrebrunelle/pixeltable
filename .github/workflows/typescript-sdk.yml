name: TypeScript SDK

on:
  pull_request:
    paths: ['typescript-sdk/**', '.github/workflows/typescript-sdk.yml']
  push:
    branches: [main]
    paths: ['typescript-sdk/**', '.github/workflows/typescript-sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: typescript-sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript-sdk/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm pack --dry-run
